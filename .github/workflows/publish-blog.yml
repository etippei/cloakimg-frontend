name: Publish Blog from Issues

on:
  issues:
    types: [labeled, opened, edited, closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ✅ 获取完整历史，避免冲突
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests markdown pyyaml
      
      - name: Run build script
        run: python .github/scripts/build_blog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
      
      - name: Commit and push generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 拉取远程最新代码
          git pull origin main --rebase --autostash
          
          # 添加变更
          git add blog.html blog/posts/ blog/posts.json 2>/dev/null || true
          
          # 如果有变更则提交
          if git diff --staged --quiet; then
            echo "📭 No changes to commit"
          else
            git commit -m "chore: auto-update blog from issues [skip ci]"
            git push origin main
            echo "✅ Changes pushed successfully"
          fi
